name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4

      - name: Create project
        run: |
          python3 << 'PY'
          import os, pathlib
          # هادي هي المهمة - خاص google() باش يلقا android plugin
          settings = """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          plugins {
              id("com.android.application") version "8.2.2" apply false
          }
          include(":app")
          """
          pathlib.Path("settings.gradle.kts").write_text(settings)
          pathlib.Path("build.gradle.kts").write_text('// empty root\n')
          
          os.makedirs("app/src/main/assets", exist_ok=True)
          os.makedirs("app/src/main/java/com/tinetoh/game", exist_ok=True)
          pathlib.Path("app/build.gradle.kts").write_text('plugins { id("com.android.application") }\nandroid { namespace = "com.tinetoh.game"\n compileSdk = 34\n defaultConfig { applicationId = "com.tinetoh.game"; minSdk = 21; targetSdk = 34; versionCode = 1; versionName = "1.0" } }\ndependencies { implementation("androidx.appcompat:appcompat:1.6.1") }\n')
          pathlib.Path("app/src/main/AndroidManifest.xml").write_text('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Tinetoh" android:theme="@android:style/Theme.NoTitleBar.Fullscreen"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          pathlib.Path("app/src/main/java/com/tinetoh/game/MainActivity.java").write_text('package com.tinetoh.game; import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; public class MainActivity extends Activity { protected void onCreate(Bundle b) { super.onCreate(b); WebView w = new WebView(this); w.getSettings().setJavaScriptEnabled(true); w.getSettings().setAllowFileAccess(true); w.getSettings().setDomStorageEnabled(true); w.loadUrl("file:///android_asset/index.html"); setContentView(w); } }')
          print("OK")
          PY

      - name: Copy game files
        run: |
          cp -r *.html app/src/main/assets/ 2>/dev/null || true
          cp -r *.js app/src/main/assets/ 2>/dev/null || true
          cp -r src app/src/main/assets/ 2>/dev/null || true
          cp -r assets app/src/main/assets/ 2>/dev/null || true
          cp -r public app/src/main/assets/ 2>/dev/null || true
          cp -r dist app/src/main/assets/ 2>/dev/null || true
          ls app/src/main/assets | head -n 20

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tinetoh-APK
          path: app/build/outputs/apk/debug/*.apk
