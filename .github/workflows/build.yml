name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4

      - name: Create project
        run: |
          python3 << 'PY'
          import pathlib, os
          # settings
          pathlib.Path("settings.gradle.kts").write_text("""
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          plugins { id("com.android.application") version "8.2.2" apply false }
          include(":app")
          """)
          pathlib.Path("build.gradle.kts").write_text('// root')
          
          # هادي هي اللي كانت ناقصة - ضرورية!
          pathlib.Path("gradle.properties").write_text("""
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          """)
          
          os.makedirs("app/src/main/assets", exist_ok=True)
          os.makedirs("app/src/main/java/com/tinetoh/game", exist_ok=True)
          pathlib.Path("app/build.gradle.kts").write_text("""
          plugins { id("com.android.application") }
          android {
              namespace = "com.tinetoh.game"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.tinetoh.game"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          """)
          pathlib.Path("app/src/main/AndroidManifest.xml").write_text('<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Tinetoh" android:theme="@android:style/Theme.NoTitleBar.Fullscreen"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          pathlib.Path("app/src/main/java/com/tinetoh/game/MainActivity.java").write_text('package com.tinetoh.game; import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; public class MainActivity extends Activity { protected void onCreate(Bundle b) { super.onCreate(b); WebView w = new WebView(this); w.getSettings().setJavaScriptEnabled(true); w.getSettings().setAllowFileAccess(true); w.getSettings().setDomStorageEnabled(true); w.loadUrl("file:///android_asset/index.html"); setContentView(w); } }')
          PY

      - name: Copy web files
        run: |
          if [ -f "index.html" ]; then cp index.html app/src/main/assets/; fi
          for f in *.html *.js *.json *.css; do [ -f "$f" ] && cp "$f" app/src/main/assets/ 2>/dev/null; done
          [ -d "src" ] && cp -r src app/src/main/assets/ 2>/dev/null || true
          [ -d "public" ] && cp -r public/* app/src/main/assets/ 2>/dev/null || true
          [ -d "dist" ] && cp -r dist/* app/src/main/assets/ 2>/dev/null || true
          ls app/src/main/assets | head -n 20

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Tinetoh-APK
          path: app/build/outputs/apk/debug/*.apk
